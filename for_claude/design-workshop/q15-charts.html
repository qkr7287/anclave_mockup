<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anclave 디자인 — Q15. 차트 디테일</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0d1117;--soft:#10151c;--card:#161c26;--card2:#1c2430;--border:rgba(255,255,255,.07);
    --text:#e6edf3;--muted:#8b97a7;--faint:#6a7585;--accent:#6ea8fe;--accent-soft:rgba(110,168,254,.12);--on-accent:#08111f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0d12;color:var(--text);font-family:"Pretendard",system-ui,sans-serif;line-height:1.5;padding:32px 24px 80px;font-size:14.5px}
  .page-head{max-width:1080px;margin:0 auto 26px}
  .page-head .q{display:inline-block;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:12px;padding:3px 10px;border-radius:20px;letter-spacing:.5px}
  .page-head h1{font-size:27px;margin:12px 0 6px;letter-spacing:-.5px}
  .page-head p{color:var(--muted);font-size:14.5px}
  .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:30px}

  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
  .sec-head .nm{font-size:16px;font-weight:700}
  .sec-head .desc{color:var(--faint);font-size:12.5px}
  .variants{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .variant{background:var(--card2);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.35);overflow:hidden}
  .variant.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 2px 12px rgba(0,0,0,.4)}
  .sel-tag{margin-left:auto;color:#3fb950;font-weight:800;font-size:11.5px}
  .v-label{display:flex;align-items:center;gap:10px;padding:11px 16px;background:#11161e;border-bottom:1px solid var(--border);font-size:12.5px}
  .v-label .pick{background:#1b232f;color:#cfd6df;font-weight:800;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
  .v-label .vt{font-weight:700}
  .v-label .vd{color:var(--faint);font-size:11.5px}
  .v-demo{padding:18px 16px}
  .legend{display:flex;gap:14px;margin-bottom:10px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%;background:var(--accent)}

  .chart-box{position:relative}
  .chart-svg{width:100%;height:170px;display:block;overflow:visible}
  .gl{stroke:rgba(255,255,255,.06)}
  .ax{fill:var(--faint);font-size:10px}
  .hover-line{stroke:rgba(255,255,255,.18);stroke-width:1;stroke-dasharray:3 3}
  .hover-dot{fill:var(--accent);stroke:#0a0d12;stroke-width:2}
  .tip{position:absolute;pointer-events:none;background:#222b38;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.5);transform:translate(-50%,-100%);white-space:nowrap;opacity:0;transition:opacity .1s}
  .tip .tv{font-weight:800;font-size:13px}
  .tip .tx{color:var(--muted);font-size:11px}

  .footer{max-width:1080px;margin:30px auto 0;color:var(--muted);font-size:13.5px}
  .footer b{color:#ccd}
  .footer .ask{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:10px;font-size:13px;color:var(--text)}
  .footer .ask code{background:#ffffff10;padding:2px 7px;border-radius:6px;font-size:12.5px;color:var(--accent)}
</style>
</head>
<body>
  <div class="page-head">
    <span class="q">Q15 / 차트 디테일</span> <span style="display:inline-block;background:rgba(63,185,80,.13);color:#3fb950;font-weight:800;font-size:12px;padding:3px 11px;border-radius:20px;margin-left:6px">✓ 선택: 차트 A (미니멀)</span>
    <h1>차트 축·그리드·툴팁은?</h1>
    <p>Q5 영역 라인 차트의 마감. <b style="color:#6ea8fe">A 미니멀</b> = 축 라벨만·그리드 없음 · <b style="color:#6ea8fe">B 가이드</b> = 옅은 가로 그리드 + 범례. 둘 다 <b>hover 툴팁</b>은 공통 — 차트에 마우스를 올려보세요.</p>
  </div>

  <div class="wrap">
    <section>
      <div class="sec-head"><span class="nm">시계열 차트</span><span class="desc">토큰 호출 추이 · hover로 값 확인</span></div>
      <div class="variants">
        <div class="variant sel">
          <div class="v-label"><span class="pick">A</span><span class="vt">미니멀</span><span class="vd">축 라벨만 · 그리드 없음 · 깔끔</span><span class="sel-tag">✓ 선택됨</span></div>
          <div class="v-demo">
            <div class="chart-box" id="boxA"><svg class="chart-svg" id="svgA"></svg><div class="tip" id="tipA"></div></div>
          </div>
        </div>
        <div class="variant">
          <div class="v-label"><span class="pick">B</span><span class="vt">가이드 그리드</span><span class="vd">옅은 가로 그리드 + 범례 · 읽기 쉬움</span></div>
          <div class="v-demo">
            <div class="legend"><span><i></i>토큰 호출</span></div>
            <div class="chart-box" id="boxB"><svg class="chart-svg" id="svgB"></svg><div class="tip" id="tipB"></div></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="footer">
    <p>→ 다음: <b>Q16. 반응형</b></p>
    <div class="ask">골라주세요 — <code>차트 A</code> 또는 <code>차트 B</code></div>
  </div>

<script>
  const vals=[34,41,38,52,47,61,55,68], labels=['09','10','11','12','13','14','15','16'];
  const max=80, W=440, H=170, pl=30, pr=12, pt=12, pb=22;
  const iw=W-pl-pr, ih=H-pt-pb;
  const X=i=>pl+iw*i/(vals.length-1);
  const Y=v=>pt+ih*(1-v/max);

  function draw(svgId, withGrid){
    const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    let g='';
    if(withGrid){
      [0,20,40,60,80].forEach(v=>{ g+=`<line class="gl" x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}"/>`; });
    }
    // y axis labels
    let ya='';
    [0,40,80].forEach(v=>{ ya+=`<text class="ax" x="${pl-7}" y="${Y(v)+3}" text-anchor="end">${v}</text>`; });
    // x axis labels
    let xa='';
    labels.forEach((l,i)=>{ if(i%2===0) xa+=`<text class="ax" x="${X(i)}" y="${H-7}" text-anchor="middle">${l}시</text>`; });
    const svg=document.getElementById(svgId);
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    svg.innerHTML=`
      ${g}
      <polyline points="${X(0)},${pt+ih} ${pts} ${X(vals.length-1)},${pt+ih}" fill="rgba(110,168,254,.14)" stroke="none"/>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${ya}${xa}
      <line class="hover-line" id="${svgId}-hl" x1="0" y1="${pt}" x2="0" y2="${pt+ih}" style="opacity:0"/>
      <circle class="hover-dot" id="${svgId}-hd" r="4.5" style="opacity:0"/>`;
  }

  function bindHover(boxId,svgId,tipId){
    const box=document.getElementById(boxId), svg=document.getElementById(svgId), tip=document.getElementById(tipId);
    const hl=document.getElementById(svgId+'-hl'), hd=document.getElementById(svgId+'-hd');
    box.addEventListener('mousemove',e=>{
      const r=svg.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width*W;
      let i=Math.round((px-pl)/iw*(vals.length-1));
      i=Math.max(0,Math.min(vals.length-1,i));
      const cx=X(i), cy=Y(vals[i]);
      hl.setAttribute('x1',cx); hl.setAttribute('x2',cx); hl.style.opacity=1;
      hd.setAttribute('cx',cx); hd.setAttribute('cy',cy); hd.style.opacity=1;
      const sx=cx/W*r.width, sy=cy/H*r.height;
      tip.style.left=sx+'px'; tip.style.top=(sy-10)+'px'; tip.style.opacity=1;
      tip.innerHTML=`<div class="tv">${vals[i].toLocaleString()} 호출</div><div class="tx">${labels[i]}:00</div>`;
    });
    box.addEventListener('mouseleave',()=>{hl.style.opacity=0;hd.style.opacity=0;tip.style.opacity=0;});
  }

  draw('svgA',false); draw('svgB',true);
  bindHover('boxA','svgA','tipA'); bindHover('boxB','svgB','tipB');
</script>
<script src="nav.js"></script>
</body>
</html>
